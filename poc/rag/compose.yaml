services:
  sqlserver-2025-poc:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: assistia-rag-poc-sqlserver-2025
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${RAG_POC_SQLSERVER_PASSWORD:?Set RAG_POC_SQLSERVER_PASSWORD to a unique local password}
    ports:
      - "127.0.0.1:11434:1433"
    volumes:
      - rag_poc_sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  rag_poc_sqlserver_data:
