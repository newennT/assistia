spring.application.name=assistia-backend

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

assistia.frontend-origin=${ASSISTIA_FRONTEND_ORIGIN:http://localhost:5173}
assistia.cookie-secure=${ASSISTIA_COOKIE_SECURE:false}
assistia.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
assistia.gemini.timeout-ms=${GEMINI_TIMEOUT_MS:30000}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${ASSISTIA_COOKIE_SECURE:false}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
