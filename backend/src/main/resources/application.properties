spring.application.name=assistia-backend

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

assistia.frontend-origin=${ASSISTIA_FRONTEND_ORIGIN:http://localhost:5173}
assistia.cookie-secure=${ASSISTIA_COOKIE_SECURE:false}
assistia.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
assistia.gemini.timeout-ms=${GEMINI_TIMEOUT_MS:90000}
assistia.rag.enabled=${ASSISTIA_RAG_ENABLED:false}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${ASSISTIA_COOKIE_SECURE:false}

spring.servlet.multipart.max-file-size=${ASSISTIA_KNOWLEDGE_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${ASSISTIA_KNOWLEDGE_MAX_REQUEST_SIZE:21MB}
assistia.knowledge.max-file-size-bytes=${ASSISTIA_KNOWLEDGE_MAX_FILE_SIZE_BYTES:20971520}
assistia.knowledge.storage-directory=${ASSISTIA_KNOWLEDGE_STORAGE_DIRECTORY:${user.home}/.assistia/knowledge-documents}
assistia.knowledge.chunk-target-tokens=${ASSISTIA_KNOWLEDGE_CHUNK_TARGET_TOKENS:700}
assistia.knowledge.chunk-overlap-tokens=${ASSISTIA_KNOWLEDGE_CHUNK_OVERLAP_TOKENS:100}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
