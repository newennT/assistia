spring.datasource.url=${ASSISTIA_SQLSERVER_V5_TEST_URL:jdbc:sqlserver://localhost:1434;databaseName=AssistIAV5Test;encrypt=true;trustServerCertificate=true;vectorTypeSupport=v2}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${ASSISTIA_SQLSERVER_V5_TEST_USERNAME:sa}
spring.datasource.password=${ASSISTIA_SQLSERVER_V5_TEST_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false
spring.flyway.enabled=true
